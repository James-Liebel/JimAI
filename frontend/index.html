<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="jimAI" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#800000" />
    <!-- Paint the base color before CSS/JS load so the status-bar/notch and
         home-indicator safe areas (and any first-paint frame) never flash dark. -->
    <style>
      html, body { background-color: #FFFFFF; }
    </style>
    <meta name="description" content="jimAI — Local-only AI system with autonomous app building and orchestration" />

    <title>jimAI</title>
    <!-- Fonts are self-hosted (bundled woff2 via @fontsource, imported in
         main.tsx) — no external font CDN, so cold/offline starts stay instant. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
